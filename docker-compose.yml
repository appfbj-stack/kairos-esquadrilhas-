services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kairos}
      POSTGRES_DB: kairos_esquadrias
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # O schema inicial e carregado na primeira subida
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kairos -d kairos_esquadrias']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kairos_net
      - dokploy-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: 'true'
      ENABLE_DEMO_MODE: ${ENABLE_DEMO_MODE:-true}
      DATABASE_URL: postgresql://kairos:${POSTGRES_PASSWORD:-kairos}@postgres:5432/kairos_esquadrias
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/uploads
      STORAGE_PUBLIC_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}/api/files
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-anthropic/claude-3.5-sonnet}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    volumes:
      - app_uploads:/app/uploads
    networks:
      - kairos_net
      - dokploy-network
    # No Dokploy, o trafego externo chega via Caddy/Traefik; mantenha 3000 exposto para o proxy.
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  app_uploads:

networks:
  kairos_net:
    name: kairos-esquadrias-net
  dokploy-network:
    external: true
